# Builds the PyTauri desktop app (desktop/) with an embedded CPython for Linux.
# Separate from build-linux-app.yml, which builds the tkinter app via PyInstaller.
#
# Two matrix legs: x86_64 and aarch64. Both call desktop/scripts/linux/* rather
# than reimplementing them inline, so local and CI builds cannot drift.
# Not wired into publish-release.yml yet.

name: Build Desktop App (Linux)

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # webkit2gtk is the Tauri webview; patchelf is what the bundler uses to
      # fix up the AppImage/deb payload.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: ${{ matrix.target }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # Downloads python-build-standalone into desktop/src-tauri/pyembed.
      - name: Download python-build-standalone
        run: desktop/scripts/linux/download-py.sh ${{ matrix.target }}

      # Installs mtga-bridge and the repo-root src package into the embedded
      # interpreter, then runs `tauri build` with the bundle overlay config.
      # The script derives the rpath from tauri.conf.json's productName, which
      # is what the deb resource dir /usr/lib/<productName>/ is named after.
      - name: Build and bundle
        run: desktop/scripts/linux/build.sh

      # The rpath is the one thing that cannot be checked without a real
      # bundle: if it disagrees with the deb layout the app dies at the dynamic
      # linker, before any Python runs. Unpack the deb and confirm libpython
      # actually sits where the binary's RUNPATH points.
      - name: Verify deb rpath resolves to the bundled libpython
        run: |
          set -euo pipefail
          deb="$(find desktop/target -name '*.deb' -print -quit)"
          [ -n "$deb" ] || { echo "no .deb produced"; exit 1; }
          echo "inspecting $deb"

          workdir="$(mktemp -d)"
          dpkg-deb -x "$deb" "$workdir"

          product_name="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["productName"])' \
              desktop/src-tauri/tauri.conf.json
          )"
          binary="$workdir/usr/bin/mtga-draft-desktop"
          libdir="$workdir/usr/lib/$product_name/lib"

          echo "--- payload tree ---"
          ls "$workdir/usr/lib/"

          runpath="$(patchelf --print-rpath "$binary")"
          echo "RUNPATH: $runpath"
          echo "$runpath" | grep -Fq "/../lib/$product_name/lib" \
            || { echo "RUNPATH does not point at /usr/lib/$product_name/lib"; exit 1; }

          ls "$libdir"/libpython*.so* \
            || { echo "no libpython in $libdir — rpath would not resolve"; exit 1; }

          # Nothing may remain unresolved. ldd exits 0 even when it prints
          # "not found", so grep for it explicitly.
          if ldd "$binary" | grep 'not found'; then
            echo "unresolved shared libraries"; exit 1
          fi
          echo "rpath OK"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: mtga-draft-desktop-linux-${{ matrix.target }}
          path: |
            desktop/target/bundle-release/bundle/deb/*.deb
            desktop/target/bundle-release/bundle/rpm/*.rpm
          if-no-files-found: error
