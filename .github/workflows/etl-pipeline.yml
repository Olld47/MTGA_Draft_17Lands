# Daily dataset ETL. Aggregates Scryfall + 17Lands telemetry into compressed
# .json.gz datasets (plus manifest.json and report.json) and publishes them to
# GitHub Pages — the primary data source for the desktop app's DatasetUpdater,
# which syncs at most once per UTC day. server/main.py also runs post-transform
# data-quality checks; a broken run is surfaced to users through report.json's
# pipeline_run.status, which the client reads as a health flag.

name: Daily Dataset ETL Pipeline

on:
  schedule:
    # Runs at 10:00 AM UTC every day (Adjust as needed)
    - cron: "0 10 * * *"
  workflow_dispatch: # Allows manual triggering from the GitHub UI

permissions:
  contents: write # Required to push to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install Dependencies
        run: poetry install --no-interaction --only main

      - name: Checkout Historical Data (gh-pages)
        # We checkout the gh-pages branch into the build directory.
        # This allows server/main.py to read the old manifest.json and preserve inactive sets!
        uses: actions/checkout@v7.0.1
        continue-on-error: true # Will fail on the very first run if gh-pages doesn't exist yet, which is fine
        with:
          ref: gh-pages
          path: build

      - name: Get current UTC date
        id: date
        # Rotates the cache key every UTC day (the server keys on UTC). actions/cache
        # does not overwrite an existing key, so without rotation the blob freezes at
        # its first run and the Scryfall 7-day cache silently stops persisting.
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore API Caches
        uses: actions/cache@v4
        with:
          # Tell GitHub to save/restore the two folders the pipeline uses.
          path: |
            .api_cache
            .scryfall_cache
          # Fresh key each UTC day so the save always lands and the cache rolls
          # forward day to day. The restored files keep their mtimes, so the
          # server's own TTLs drive freshness: 17Lands is re-fetched every run
          # (12h TTL, feeding the client's once-per-UTC-day sync) while Scryfall
          # base data persists up to 7 days. restore-keys falls back to the most
          # recent previous day when the exact key misses.
          key: etl-cache-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            etl-cache-${{ runner.os }}-

      - name: Run ETL Pipeline
        env:
          ETL_OUTPUT_DIR: build # Matches your config.py
        run: |
          # If the gh-pages branch didn't exist yet, ensure the build dir exists
          mkdir -p build
          poetry run python -m server.main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Automated ETL update: ${{ github.event.head_commit.message }}"
