# Builds & publishes the desktop (PyTauri) bundles — the only client. The
# tkinter/PyInstaller app was removed (2026-08-15); the macOS/Windows exe
# build workflows no longer exist.
#
# The two desktop legs are inline jobs, not reusable-workflow calls, so that
# `continue-on-error` is a legal keyword: a red desktop build must not mark an
# otherwise-successful release as failed. Each leg mirrors the steps of
# build-desktop-macos.yml / build-desktop-windows.yml so the release artifact
# is built the same way as the validated artifact those workflows check.
#
# The bundles are unsigned and the .msi has not been launched on hardware, so
# before any release is trusted: launch-verify the macOS .dmg/.app and the
# Windows .msi on real machines, and land code signing/notarization. Until
# then the body keeps the macOS Gatekeeper note.

name: Build & Publish Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write # Required to create the GitHub Release

jobs:
  build-desktop-macos:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # Downloads python-build-standalone into desktop/src-tauri/pyembed.
      # Kept in the script so local and CI builds cannot drift.
      - name: Download python-build-standalone
        run: desktop/scripts/macos/download-py.sh aarch64-apple-darwin

      # Installs mtga-bridge and the repo-root src package into the embedded
      # interpreter, then runs `tauri build` with the bundle overlay config.
      - name: Build and bundle
        run: desktop/scripts/macos/build.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mtga-draft-desktop-macos-aarch64
          path: |
            desktop/target/bundle-release/bundle/dmg/*.dmg
            desktop/target/bundle-release/bundle/macos/*.app
          if-no-files-found: error

  build-desktop-windows:
    runs-on: windows-2022
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # Downloads python-build-standalone into desktop/src-tauri/pyembed.
      # Kept in the script so local and CI builds cannot drift.
      - name: Download python-build-standalone
        shell: pwsh
        run: .\desktop\scripts\windows\download-py.ps1 x86_64-pc-windows-msvc

      # Installs mtga-bridge and the repo-root src package into the embedded
      # interpreter, then runs `tauri build` with the bundle overlay config.
      - name: Build and bundle
        shell: pwsh
        run: .\desktop\scripts\windows\build.ps1

      # The .exe is not launched — it opens a window and would hang the runner.
      # Instead assert the contract that a bundle can silently violate: the
      # embedded interpreter must land in the same directory as the .exe, since
      # that is where the loader looks for python3*.dll.
      - name: Verify the embedded interpreter is bundled
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter "mtga-draft-desktop.exe" `
            -Path desktop\target\bundle-release | Select-Object -First 1
          if (-not $exe) { throw "no mtga-draft-desktop.exe produced" }
          Write-Host "found $($exe.FullName)"

          $pydll = Get-ChildItem -Path $exe.DirectoryName -Filter "python3*.dll"
          if (-not $pydll) {
            Get-ChildItem $exe.DirectoryName | Format-Table Name
            throw "no python3*.dll beside the exe — the interpreter is missing"
          }
          Write-Host "embedded interpreter: $($pydll.Name)"

      - name: Upload bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mtga-draft-desktop-windows-x86_64
          path: |
            desktop/target/bundle-release/bundle/msi/*.msi
            desktop/target/bundle-release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: [build-desktop-macos, build-desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download macOS bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: mtga-draft-desktop-macos-aarch64
          path: release_assets/macos
      - name: Download Windows bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: mtga-draft-desktop-windows-x86_64
          path: release_assets/windows
      - name: Generate Release Body
        id: prep_release
        run: |
          python -c "
          import hashlib, json, os, re

          with open('desktop/src-tauri/tauri.conf.json', encoding='utf-8') as f:
              version = json.load(f)['version']
          tag_name = f'v{version}'

          with open(os.environ.get('GITHUB_OUTPUT', ''), 'a') as f:
              f.write(f'tag_name={tag_name}\n')

          # Extract top chunk of release_notes.txt
          with open('release_notes.txt', encoding='utf-8') as f:
              content = f.read()
          match = re.search(
              r'(===================== RELEASE NOTES .*? =====================\n.*?)(?=\n===================== RELEASE NOTES|$)',
              content, re.DOTALL,
          )
          notes = match.group(1).strip() if match else ''

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(65536), b''):
                      h.update(chunk)
              return h.hexdigest()

          def assets(platform, suffixes):
              root = os.path.join('release_assets', platform)
              if not os.path.isdir(root):
                  return []
              return sorted(
                  os.path.join(dirpath, name)
                  for dirpath, _dirnames, filenames in os.walk(root)
                  for name in filenames
                  if name.endswith(suffixes)
              )

          lines = [notes, '']
          for platform, suffixes in (
              ('macos', ('.dmg',)),
              ('windows', ('.msi', '.exe')),
          ):
              files = assets(platform, suffixes)
              if not files:
                  continue
              lines.append(f'## {platform.capitalize()}')
              lines.append('')
              for path in files:
                  lines.append(f'**{os.path.basename(path)}**')
                  lines.append(f'SHA256: \`{sha256(path)}\`')
                  lines.append('')
          lines.append(
              '*⚠️ macOS Gatekeeper bypass: because this app is unsigned, macOS '
              'may flag it as damaged or malware. If so, extract the app to your '
              'Applications folder and run \`xattr -cr /Applications/mtga-draft-desktop.app\`.*'
          )
          lines.append('')
          lines.append(
              '*Note: verify these executables and their SHA256 hashes — on Windows '
              'run \`CertUtil -hashfile <file> SHA256\` in a Command Prompt.*'
          )

          # The upload step strips the common workspace prefix, so downloaded
          # artifacts land under nested dirs (macos/dmg/*.dmg, windows/msi/*.msi).
          # Recursive globs above must not silently publish an empty release:
          # fail loud if no bundle survived the leg builds.
          if not (assets('macos', ('.dmg',)) or assets('windows', ('.msi', '.exe'))):
              raise SystemExit(
                  'no bundle assets found under release_assets/ — refusing to '
                  'publish an empty release'
              )

          with open('release_body.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          "
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prep_release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            release_assets/macos/**/*.dmg
            release_assets/windows/**/*.msi
            release_assets/windows/**/*.exe
          body_path: release_body.md
          generate_release_notes: true
          overwrite_files: true

      # GitHub's "immutable releases" setting freezes a release the moment it
      # is published — assets can only be uploaded while the release is a
      # draft. softprops created the draft above; publish it here, which fires
      # release.published. Re-runs against a tag that was already published
      # are a no-op (immutable releases cannot replace assets on a published
      # release).
      - name: Publish release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.prep_release.outputs.tag_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" \
              --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
          else
            echo "release $TAG is already published — nothing to do"
          fi
