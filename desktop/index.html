<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTGA Draft Tool</title>
    <script>
      // Settings arrive over async IPC, so paint the last known palette first
      // or every Light user gets a dark flash on launch. state/theme.ts owns
      // the key and overwrites this once the real preference loads.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("mtga.theme") || "dark";
        document.documentElement.lang =
          localStorage.getItem("mtga.lang") || "en";
        // state/scale.ts owns this key and overwrites it once the real setting
        // loads; painting it first avoids a zoom flash on launch. Mirror its
        // clamp (0.4–2.5, junk → 1) so a corrupted/legacy stored value can't
        // produce an unclamped zoom before the real setting arrives.
        const storedScale = Number(localStorage.getItem("mtga.uiScale"));
        const uiScaleFactor =
          Number.isFinite(storedScale) &&
          storedScale >= 0.4 &&
          storedScale <= 2.5
            ? storedScale
            : 1;
        document.documentElement.style.setProperty(
          "--ui-scale",
          String(uiScaleFactor),
        );
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
