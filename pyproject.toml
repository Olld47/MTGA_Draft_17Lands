[tool.poetry]
name = "mtga-draft-tool"
version = "4.19"
description = "Magic: The Gathering Arena draft tool that utilizes 17Lands data."
authors = ["unrealities"]
readme = "README.md"
packages = [
    { include = "src" },
    { include = "server" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "2.4.4"
Pillow = "12.2.0"
pydantic = "2.13.4"
requests = "2.33.1"
numba = "0.65.1"
scipy = "1.17.1"

[tool.poetry.group.dev.dependencies]
# mtga_bridge.boot imports anyio at module level; the desktop project pins the
# same range in desktop/src-tauri/pyproject.toml. Needed here so the bridge
# tests can import it from the root environment.
anyio = "4.*"
pytest = "9.0.3"
pytest-cov = "^5.0.0"
responses = "0.26.0"
jaraco-text = "*"
platformdirs = "*"
importlib-metadata = "*"
zipp = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
